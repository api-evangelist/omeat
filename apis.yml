name: Omeat
description: 'Omeat (rebranded as Evergreen Select) is a cultivated-beef company that
  partners with global meat producers to create price-predictable, industrial-scale
  beef supply. It produces 100% real beef without antibiotics, hormones, or plant-based
  fillers, positioning cultivated meat as a practical supplement to conventional supply
  chains while holding pricing at parity with commodity ground beef. Founded by tissue-engineering
  researcher Ali Khademhosseini and backed by GV, the company targets restaurants and
  meat processors seeking supply-chain stability and consistent quality. As of this
  enrichment pass Omeat operates as a food/biotech producer with a marketing website
  only: no public API, developer portal, documentation, SDKs, or GitHub organization
  were found, so there is no machine-readable API surface to catalog. This profile is
  retained as a company/lead record surfaced from the GV venture portfolio.'
